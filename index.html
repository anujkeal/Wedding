<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Komal weds Akash · Wedding Invitation</title>
  <style>
    :root {
      --ivory: #fff8eb;
      --parch: #f2e4cc;
      --maroon: #701d32;
      --gold: #c6a15b;
      --jas: #fffcf4;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Georgia, serif;
      background: var(--ivory);
      color: var(--maroon);
    }

    body {
      overflow-x: hidden;
    }

    #env {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 35%, #ffd54f, #ff7a00 42%, #c2185b 85%);
      transition: opacity 1s ease, visibility 0s linear 1s;
    }

    #env.open {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .card {
      position: relative;
      width: min(92vw, 520px);
      padding: 2.5rem 1.5rem 2rem;
      text-align: center;
      background: var(--ivory);
      border: 1px solid var(--gold);
      box-shadow: 0 0 0 8px var(--ivory), 0 0 0 9px var(--gold), 0 30px 60px rgba(74, 16, 38, 0.18);
      overflow: hidden;
    }

    .flap {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 130px;
      background: #ffe0b2;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: top;
      transition: transform .9s ease;
      z-index: 2;
    }

    .seal {
      position: absolute;
      left: 50%;
      top: 130px;
      transform: translate(-50%, -50%);
      width: 76px;
      height: 76px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 700;
      letter-spacing: 0.08em;
      background: radial-gradient(circle at 35% 30%, #ff5c8a, #c2185b 60%, #7b0f3a);
      z-index: 3;
      transition: all .5s ease;
    }

    .tw {
      margin-top: 8.5rem;
      font-style: italic;
      font-size: 1.15rem;
    }

    .names {
      margin: 0;
      font-family: "Pinyon Script", cursive;
      font-size: clamp(2.6rem, 8vw, 3.8rem);
      line-height: 1.05;
      color: var(--maroon);
    }

    .rule {
      position: relative;
      width: 140px;
      height: 12px;
      margin: 1.2rem auto;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      border-radius: 999px;
    }

    .rule::after {
      content: "❖";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -52%);
      background: var(--ivory);
      color: var(--gold);
      padding: 0 .4rem;
      font-size: 14px;
      line-height: 1;
    }

    .btn {
      display: inline-block;
      font: 500 0.8rem "Jost", Arial, sans-serif;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      border: 1px solid var(--maroon);
      background: linear-gradient(135deg, #c2185b, #ff7a00);
      color: var(--jas);
      padding: 0.95rem 1.6rem;
      min-height: 46px;
      cursor: pointer;
    }

    .btn:hover {
      background: linear-gradient(135deg, #ff7a00, #c2185b);
    }

    .skip {
      position: absolute;
      bottom: 1rem;
      right: 1rem;
      font: 0.85rem "Jost", Arial, sans-serif;
      background: none;
      border: 0;
      color: var(--maroon);
      text-decoration: underline;
      cursor: pointer;
      z-index: 60;
    }

    #hero {
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 8rem 1.25rem 4rem;
      background: linear-gradient(165deg, #ffd54f 0%, #ff9a3c 32%, #f0508a 72%, #8e24aa 100%);
      color: var(--maroon);
    }

    .card-inner {
      max-width: 640px;
      padding: 4rem 1.5rem 3rem;
      background: rgba(255, 252, 244, 0.92);
      border: 1px solid var(--gold);
      box-shadow: inset 0 0 0 8px #fffcf4, inset 0 0 0 10px #ff7a00, 0 20px 50px rgba(74, 16, 38, 0.35);
      border-radius: 300px 300px 0 0;
    }

    .hero-name {
      font-family: "Pinyon Script", cursive;
      font-size: clamp(3.5rem, 12vw, 6rem);
      margin: 0;
      line-height: 1.05;
    }

    .amp {
      font-style: italic;
      font-size: 1.7rem;
      color: var(--gold);
    }

    .tag {
      margin-top: 0.5rem;
      font-size: 1.25rem;
      font-style: italic;
    }

    .date {
      margin-top: 1rem;
      font: 500 0.9rem "Jost", Arial, sans-serif;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .scroll {
      display: inline-block;
      margin-top: 2rem;
      font: 0.8rem "Jost", Arial, sans-serif;
      letter-spacing: 0.15em;
      text-decoration: none;
      color: var(--maroon);
    }

    .scroll::after {
      content: "";
      display: block;
      width: 1px;
      height: 42px;
      background: var(--gold);
      margin: 0.6rem auto 0;
      animation: drip 2.2s infinite;
    }

    @keyframes drip {
      0% { transform: scaleY(0); transform-origin: top; }
      50% { transform: scaleY(1); transform-origin: top; }
      51% { transform-origin: bottom; }
      100% { transform: scaleY(0); transform-origin: bottom; }
    }

    @media (max-width: 520px) {
      .card { padding: 2rem 1rem 1.5rem; }
      .tw { margin-top: 7.7rem; }
    }
  </style>
</head>
<body>
  <div id="env" role="dialog" aria-label="Wedding invitation envelope">
    <div class="card">
      <div class="flap"></div>
      <div class="seal" aria-hidden="true">K&A</div>
      <p class="tw">Together with their families</p>
      <h1 class="names">Komal <span class="amp" style="font-size: .5em;">weds</span> Akash</h1>
      <div class="rule"></div>
      <button class="btn" id="openBtn" type="button">Open your invitation</button>
    </div>
    <button class="skip" id="skip" type="button">Skip</button>
  </div>

  <main id="hero">
    <div class="card-inner">
      <h2 class="hero-name">Komal <span class="amp">&amp;</span> Akash</h2>
      <div class="tag">With the blessings of our families</div>
      <div class="date">25 November – 8 December 2026</div>
      <a href="#" class="scroll">Scroll to explore</a>
    </div>
  </main>

  <script>
    const env = document.getElementById('env');
    const openBtn = document.getElementById('openBtn');
    const skipBtn = document.getElementById('skip');

    function openInvitation() {
      env.classList.add('open');
      const bgm = document.getElementById('bgm');
      if (bgm) {
        bgm.play().catch(() => {});
      }
    }

    if (openBtn) openBtn.addEventListener('click', openInvitation);
    if (skipBtn) skipBtn.addEventListener('click', openInvitation);
  </script>
</body>
</html>
