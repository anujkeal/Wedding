<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wedding Invitation</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #fff3dc, #f5d7d7);
        font-family: Arial, sans-serif;
        text-align: center;
      }
      .card {
        background: rgba(255,255,255,0.9);
        border: 1px solid #d7b58a;
        border-radius: 18px;
        box-shadow: 0 12px 32px rgba(0,0,0,0.12);
        padding: 28px 24px;
        width: min(92vw, 720px);
      }
      img {
        width: min(100%, 420px);
        height: auto;
        border-radius: 16px;
        display: block;
        margin: 0 auto 18px;
        object-fit: cover;
      }
      audio {
        width: min(100%, 420px);
        margin-top: 12px;
      }
      h1 {
        margin: 0 0 16px;
        color: #5a1d2e;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Wedding Invitation</h1>
      <img src="IMG_20261023_191647.jpg" alt="Couple Photo" />
      <audio controls autoplay loop>
        <source src="RADHA KRISHNA FLUTE MUSIC  RELAXING MUSIC _SLEEP MUSIC(MP3_320K).mp3" type="audio/mpeg" />
        Your browser does not support the audio element.
      </audio>
    </div>
  </body>
</html>
